<div class="container">
     @if (formService.currentStep() > 0) {
       <button (click)="formService.prevStep()" class="back">Go Back</button>
     }
     @if (!formService.hideComplete()) {
       <button (click)="formService.nextStep()" class="next" [disabled]="formService.currentPath() === 'your-info' && !formService.form.valid">Next Step</button>

     }

     @if (formService.hideComplete()) {
       <button routerLink="./thank-you" class="complete">Complete</button>

     }
   </div>
