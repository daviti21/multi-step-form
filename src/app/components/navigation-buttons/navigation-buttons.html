<button (click)="formService.changeMonthly()">Change</button>
<p>{{formService.monthly() ? 'month' : 'year'}}</p>


@if (formService.currentStep() > 0) {
  <button (click)="formService.prevStep()">Back</button>
}
@if (formService.currentStep() < 3) {
  <button (click)="formService.nextStep()">Next</button>

}

@if (formService.currentStep() === 3) {
  <button routerLink="./thank-you" >Complete</button>

}
