


 @if (!formService.currentPath('thank-you')) {
   <div class="container">
     @if (formService.currentStep() > 0) {
       <button (click)="formService.prevStep()" class="back">Go Back</button>
     }
     @if (formService.currentStep() < 3) {
       <button (click)="formService.nextStep()" class="next">Next Step</button>

     }

     @if (formService.currentStep() === 3) {
       <button routerLink="./thank-you" class="complete">Complete</button>

     }
   </div>
 }
