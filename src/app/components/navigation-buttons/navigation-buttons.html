<div class="container">
     @if (formService.currentStep() > 0) {
       <button (click)="prevStep()" class="back">Go Back</button>
     }
     @if (!formService.hideComplete()) {
       <button (click)="nextStep()" class="next" [disabled]="!isStepValid()">Next Step</button>

     }

     @if (formService.hideComplete()) {
       <button routerLink="./thank-you" class="complete">Complete</button>

     }
   </div>
